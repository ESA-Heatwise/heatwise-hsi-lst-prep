# Docker/CWL variant of run_all_config.yaml.
#
# Supporting resources bundled with the processor image can use absolute
# /app/... paths, since the repository is copied into the image at build time.
#
# EO input products are provided separately through the CWL `input_catalog`
# Directory. The staged directory must contain a catalog.json with relative
# links to its STAC Items and assets.
#
# Run with:
#   cd examples && cwltool ../heatwise_hsi_lst_prep.cwl job.yaml
output_dir: "."
wavelength_file: /app/data/CHIME_v2_wavelengths_um.txt
process_lst: true
process_pca: false
sharpen_method: linear

band_trim_default:
  mode: keep
  ranges: "6-71,188-245"

lst_default:
  band: 7
  normalization: zscore

band_selection:
  keep_ranges: [[6, 71], [188, 245]]
  target_bands: 30
  target_clusters: 55
  vote_threshold: 0.5
  smoothness_cut_pct: 95
  n_sample: 20000
