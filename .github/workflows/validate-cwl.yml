name: Validate CWL

on:
  push:
    branches:
      - eoap-compliance
    paths:
      - "heatwise_hsi_lst_prep.cwl"
      - ".github/workflows/validate-cwl.yml"
  workflow_dispatch:

jobs:
  validate-cwl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cwltool
        run: python -m pip install --upgrade pip cwltool

      - name: Validate CWL
        run: cwltool --validate heatwise_hsi_lst_prep.cwl
